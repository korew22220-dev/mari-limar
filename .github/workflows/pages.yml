name: Publish MARLI LIMAR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare public files and SEO URLs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir _site
          cp *.html *.mp4 .nojekyll _site/
          cp -r assets _site/
          python3 - <<'PY'
          import os, pathlib, html
          root = pathlib.Path('_site')
          base = os.environ['SITE_URL'].rstrip('/')
          urls = []
          for path in sorted(root.glob('*.html')):
              url = base + '/' + ('' if path.name == 'index.html' else path.name)
              urls.append(url)
              text = path.read_text()
              tags = '<link rel="canonical" href="' + html.escape(url, quote=True) + '"><meta property="og:url" content="' + html.escape(url, quote=True) + '">'
              path.write_text(text.replace('</head>', tags + '</head>'))
          (root/'sitemap.xml').write_text('<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' + ''.join('<url><loc>'+html.escape(u)+'</loc></url>' for u in urls) + '</urlset>')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
