name: Publish MARI LIMAR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare public files and SEO URLs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir _site
          cp *.html *.mp4 .nojekyll _site/
          cp -r assets _site/
          python3 - <<'PY'
          import os, pathlib, html, hashlib, re
          root = pathlib.Path('_site')
          base = os.environ['SITE_URL'].rstrip('/')
          style_version = hashlib.sha256((root/'assets/brand-typography.css').read_bytes()).hexdigest()[:12]
          legal_footer = pathlib.Path('components/legal-footer.html').read_text(encoding='utf-8').strip()
          consent_markup = pathlib.Path('components/data-consent.html').read_text(encoding='utf-8').strip()
          def add_consent(match):
              form = match.group(0)
              if 'name="privacyConsent"' in form:
                  return form
              prefix = 'pf-request' if 'id="pf-request-form"' in form else 'ml-lead'
              markup = consent_markup.replace('__PREFIX__', prefix)
              updated, count = re.subn(r'(<button\b[^>]*type="submit"[^>]*>)', lambda button: markup + button.group(0), form, count=1)
              if count != 1:
                  raise RuntimeError('Missing submit button for ' + prefix)
              return updated
          urls = []
          for path in sorted(root.glob('*.html')):
              url = base + '/' + ('' if path.name == 'index.html' else path.name)
              urls.append(url)
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'<form\b[^>]*id="(?:ml-lead-form|pf-request-form)"[^>]*>[\s\S]*?</form>', add_consent, text)
              text = re.sub(r'assets/contact-tools\.js(?:\?[^\"]*)?', 'assets/contact-tools.js?v=consent-20261105', text)
              text = re.sub(r'assets/portfolio-inline-form\.js(?:\?[^\"]*)?', 'assets/portfolio-inline-form.js?v=consent-20261105', text)
              if text.count('</footer>') != 1:
                  raise RuntimeError('Expected one footer: ' + path.name)
              if 'class="ml-legal-links"' not in text:
                  text = text.replace('</footer>', legal_footer + '</footer>')
              text = re.sub(r'assets/brand-typography\.css(?:\?[^\"]*)?', 'assets/brand-typography.css?v=' + style_version, text)
              tags = '<link rel="canonical" href="' + html.escape(url, quote=True) + '"><meta property="og:url" content="' + html.escape(url, quote=True) + '">'
              path.write_text(text.replace('</head>', tags + '</head>'), encoding='utf-8')
          (root/'sitemap.xml').write_text('<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' + ''.join('<url><loc>'+html.escape(u)+'</loc></url>' for u in urls) + '</urlset>')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
